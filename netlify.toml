# Netlify configuration.
# No build step: the site is plain HTML, CSS and JS in this folder.

[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# /api/responses is set by `export const config` inside the function.
# No redirect: a custom path turns off the default /.netlify/functions URL.
